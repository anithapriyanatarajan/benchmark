name: publish images

on:
  workflow_dispatch:
  push:
    branches:
      - ci/publish-images

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CIPHEROPS_REGISTRY: ghcr.io/${{ github.repository_owner }}
      VCS_URL: https://github.com/${{ github.repository }}
      VCS_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build offline benchmark image
        run: python3 scripts/images.py build --stack latest --mode offline
      - name: Build simulated lab images
        run: python3 scripts/images.py build --stack draft06 --mode simulated
      - name: Publish images to GHCR
        run: |
          scripts/publish_images.sh latest offline
          scripts/publish_images.sh draft06 simulated
